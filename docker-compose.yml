services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: newtonite, POSTGRES_PASSWORD: local_dev_only, POSTGRES_DB: newtonite }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U newtonite"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment: &env
      DATABASE_URL: postgres://newtonite:local_dev_only@db:5432/newtonite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a randomly generated local secret before starting Compose}
      CORS_ORIGINS: http://localhost:5173
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, retries: 20 }
  worker:
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["npm", "run", "worker"]
    environment: *env
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: web/Dockerfile, args: { VITE_API_BASE_URL: http://localhost:3000 } }
    ports: ["5173:80"]
    depends_on: [api]
volumes: { pgdata: {} }
