services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: newtonite
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &app_environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://newtonite:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/newtonite
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random local value before starting Compose}
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.main"]
    environment: *app_environment
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        BUILD_MODE: development
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: {}
